<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexSchedule - Smart Productivity & Time Grid</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        google: {
                            blue: '#1A73E8',
                            red: '#EA4335',
                            yellow: '#FBBC04',
                            green: '#34A853',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & React DOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Dynamic Accent Root Styles -->
    <style id="dynamic-accent-styles">
        :root {
            --primary: #1A73E8;
            --primary-rgb: 26, 115, 232;
            --primary-hover: #1557b0;
            --primary-light: rgba(26, 115, 232, 0.12);
            --primary-border: rgba(26, 115, 232, 0.3);
            --primary-ring: rgba(26, 115, 232, 0.4);
        }

        .custom-accent-bg {
            background-color: var(--primary) !important;
        }

        .custom-accent-text {
            color: var(--primary) !important;
        }

        .custom-accent-border {
            border-color: var(--primary) !important;
        }

        .custom-accent-light-bg {
            background-color: var(--primary-light) !important;
        }

        .custom-accent-hover:hover {
            background-color: var(--primary-hover) !important;
        }

        .custom-accent-ring:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-ring) !important;
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }

        .time-grid-bg {
            background-size: 100% 48px;
            background-image: linear-gradient(to bottom, rgba(229, 231, 235, 0.4) 1px, transparent 1px);
        }

        .dark .time-grid-bg {
            background-image: linear-gradient(to bottom, rgba(55, 65, 81, 0.4) 1px, transparent 1px);
        }

        /* Pulse Ring for Timer */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .timer-pulse {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased select-none">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Accent Presets List
        const ACCENT_PRESETS = [
            { name: 'Google Blue', hex: '#1A73E8' },
            { name: 'Indigo', hex: '#4F46E5' },
            { name: 'Emerald', hex: '#10B981' },
            { name: 'Amber', hex: '#F59E0B' },
            { name: 'Rose', hex: '#E11D48' },
            { name: 'Violet', hex: '#8B5CF6' },
            { name: 'Teal', hex: '#0D9488' },
            { name: 'Dark Teal', hex: '#008080' }
        ];

        // Default Categories (Clean customizable starting set)
        const DEFAULT_CATEGORIES = [
            { id: 'cat-work', name: 'Work', color: '#1A73E8', icon: 'fa-briefcase' },
            { id: 'cat-study', name: 'Study', color: '#8B5CF6', icon: 'fa-book-open' },
            { id: 'cat-health', name: 'Health & Fitness', color: '#10B981', icon: 'fa-heart-pulse' },
            { id: 'cat-personal', name: 'Personal', color: '#F59E0B', icon: 'fa-user' },
            { id: 'cat-break', name: 'Rest & Break', color: '#64748B', icon: 'fa-mug-hot' }
        ];

        // Hex color to RGB object generator
        function hexToRgb(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

        // Adjust hex brightness
        function adjustHexBrightness(hex, percent) {
            const num = parseInt(hex.replace('#',''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 + (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 + (B < 255 ? (B < 1 ? 0 : B) : 255)).toString(16).slice(1);
        }

        // Sound Synthesizer via Web Audio API (No external sound files required)
        function playCompletionBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio not allowed without gesture", e);
            }
        }

        function App() {
            // Theme State
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('flex_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });

            // Primary Accent Color State
            const [accentColor, setAccentColor] = useState(() => {
                return localStorage.getItem('flex_accent_color') || '#1A73E8';
            });

            // Grid Settings
            const [gridSettings, setGridSettings] = useState(() => {
                const saved = localStorage.getItem('flex_grid_settings');
                return saved ? JSON.parse(saved) : { startHour: 7, endHour: 20, interval: 30 };
            });

            // Categories
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('flex_categories');
                return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
            });

            // Saved Activities Library
            const [savedActivities, setSavedActivities] = useState(() => {
                const saved = localStorage.getItem('flex_saved_activities');
                return saved ? JSON.parse(saved) : [
                    { id: 'act-1', title: 'Deep Work Session', categoryId: 'cat-work', duration: 60, color: '#1A73E8', icon: 'fa-laptop-code' },
                    { id: 'act-2', title: 'Daily Standup Call', categoryId: 'cat-work', duration: 30, color: '#1A73E8', icon: 'fa-users' },
                    { id: 'act-3', title: 'Gym Workout', categoryId: 'cat-health', duration: 45, color: '#10B981', icon: 'fa-dumbbell' },
                    { id: 'act-4', title: 'Focused Reading', categoryId: 'cat-study', duration: 30, color: '#8B5CF6', icon: 'fa-book' }
                ];
            });

            // Grid Time Blocks (Pure Clean Initial State: Empty array)
            const [blocks, setBlocks] = useState(() => {
                const saved = localStorage.getItem('flex_schedule_blocks');
                return saved ? JSON.parse(saved) : [];
            });

            // Food Tracker State (Pure Clean Initial State: 0 kcal, no meals)
            const [foodData, setFoodData] = useState(() => {
                const saved = localStorage.getItem('flex_food_data');
                return saved ? JSON.parse(saved) : {
                    goals: { kcal: 2000, protein: 140, carbs: 220, fat: 65, water: 8 },
                    meals: [],
                    waterGlasses: 0,
                    weightLogs: []
                };
            });

            // Active Modals & Views State
            const [activeModal, setActiveModal] = useState(null); // 'settings', 'pomodoro', 'food', 'newActivity', 'manageCategories', 'exportImport', 'editBlock'
            const [editingBlock, setEditingBlock] = useState(null);
            const [newActivityForm, setNewActivityForm] = useState({ title: '', categoryId: 'cat-work', duration: 30, color: '#1A73E8', icon: 'fa-tasks' });
            const [newCategoryForm, setNewCategoryForm] = useState({ name: '', color: '#1A73E8', icon: 'fa-folder' });
            
            // Drag and Drop state
            const [draggedActivity, setDraggedActivity] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            // Sync Accent Dynamic CSS Variables
            useEffect(() => {
                const rgb = hexToRgb(accentColor);
                const hoverHex = adjustHexBrightness(accentColor, -15);
                const root = document.documentElement;
                
                root.style.setProperty('--primary', accentColor);
                root.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
                root.style.setProperty('--primary-hover', hoverHex);
                root.style.setProperty('--primary-light', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.12)`);
                root.style.setProperty('--primary-border', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`);
                root.style.setProperty('--primary-ring', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.4)`);

                localStorage.setItem('flex_accent_color', accentColor);
            }, [accentColor]);

            // Sync Dark Mode
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('flex_dark_mode', JSON.stringify(darkMode));
            }, [darkMode]);

            // Persistence Effects
            useEffect(() => { localStorage.setItem('flex_grid_settings', JSON.stringify(gridSettings)); }, [gridSettings]);
            useEffect(() => { localStorage.setItem('flex_categories', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('flex_saved_activities', JSON.stringify(savedActivities)); }, [savedActivities]);
            useEffect(() => { localStorage.setItem('flex_schedule_blocks', JSON.stringify(blocks)); }, [blocks]);
            useEffect(() => { localStorage.setItem('flex_food_data', JSON.stringify(foodData)); }, [foodData]);

            // Toast Notifications Helper
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // Add a new block to time grid
            const handleAddBlockToTime = (startMinutes, activity = null) => {
                const duration = activity ? activity.duration : gridSettings.interval;
                const endMinutes = startMinutes + duration;

                const newBlock = {
                    id: 'block-' + Date.now(),
                    title: activity ? activity.title : 'New Scheduled Task',
                    categoryId: activity ? activity.categoryId : (categories[0]?.id || 'cat-work'),
                    startMinutes,
                    endMinutes,
                    color: activity ? (activity.color || categories.find(c => c.id === activity.categoryId)?.color || accentColor) : accentColor,
                    completed: false,
                    notes: ''
                };

                setBlocks(prev => [...prev, newBlock]);
                showToast(`Added "${newBlock.title}" to schedule`);
            };

            // Toggle block completion
            const toggleBlockComplete = (id) => {
                setBlocks(prev => prev.map(b => b.id === id ? { ...b, completed: !b.completed } : b));
            };

            // Delete block
            const deleteBlock = (id) => {
                setBlocks(prev => prev.filter(b => b.id !== id));
                showToast("Task removed from schedule");
            };

            // Resize Block Duration
            const resizeBlock = (id, deltaMinutes) => {
                setBlocks(prev => prev.map(b => {
                    if (b.id === id) {
                        const newEnd = Math.max(b.startMinutes + 15, b.endMinutes + deltaMinutes);
                        return { ...b, endMinutes: newEnd };
                    }
                    return b;
                }));
            };

            // Calculate Day Statistics
            const stats = useMemo(() => {
                const totalMinutes = blocks.reduce((acc, b) => acc + (b.endMinutes - b.startMinutes), 0);
                const completedMinutes = blocks.filter(b => b.completed).reduce((acc, b) => acc + (b.endMinutes - b.startMinutes), 0);
                const totalHours = (totalMinutes / 60).toFixed(1);
                const completedHours = (completedMinutes / 60).toFixed(1);
                const percent = totalMinutes > 0 ? Math.round((completedMinutes / totalMinutes) * 100) : 0;
                return { totalMinutes, completedMinutes, totalHours, completedHours, percent };
            }, [blocks]);

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                    
                    {/* TOP NAVBAR */}
                    <header className="h-16 px-4 md:px-6 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between shrink-0 shadow-sm z-20">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl custom-accent-bg flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                                <i className="fa-solid fa-calendar-check text-xl"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight tracking-tight flex items-center gap-2">
                                    FlexSchedule
                                    <span className="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 font-medium border border-slate-200 dark:border-slate-600">v2.5 Pro</span>
                                </h1>
                                <p className="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Dynamic Schedule & Visual Time Canvas</p>
                            </div>
                        </div>

                        {/* Top Actions & Color Accent Quick Picker */}
                        <div className="flex items-center space-x-2 sm:space-x-3">
                            {/* Accent Color Direct Quick Switcher */}
                            <div className="relative group flex items-center bg-slate-100 dark:bg-slate-700/60 p-1.5 rounded-xl border border-slate-200 dark:border-slate-600">
                                <span className="text-xs text-slate-500 dark:text-slate-400 px-2 font-medium hidden md:inline">Accent:</span>
                                <div className="flex items-center space-x-1">
                                    {ACCENT_PRESETS.slice(0, 5).map(p => (
                                        <button
                                            key={p.hex}
                                            onClick={() => setAccentColor(p.hex)}
                                            className={`w-6 h-6 rounded-full transition-transform transform hover:scale-110 flex items-center justify-center ${accentColor === p.hex ? 'ring-2 ring-offset-2 ring-slate-400 dark:ring-slate-300 scale-105' : 'opacity-80 hover:opacity-100'}`}
                                            style={{ backgroundColor: p.hex }}
                                            title={p.name}
                                        >
                                            {accentColor === p.hex && <i className="fa-solid fa-check text-[10px] text-white"></i>}
                                        </button>
                                    ))}
                                    {/* Custom Picker trigger */}
                                    <button
                                        onClick={() => setActiveModal('settings')}
                                        className="w-6 h-6 rounded-full border border-dashed border-slate-400 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center text-xs ml-1 hover:bg-slate-200 dark:hover:bg-slate-600"
                                        title="More Accent Settings"
                                    >
                                        <i className="fa-solid fa-palette"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Focus Studio Button */}
                            <button
                                onClick={() => setActiveModal('pomodoro')}
                                className="px-3 py-2 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center space-x-2"
                                title="Pomodoro Focus Timer"
                            >
                                <i className="fa-solid fa-stopwatch custom-accent-text"></i>
                                <span className="hidden sm:inline">Focus Studio</span>
                            </button>

                            {/* Food Tracker Button */}
                            <button
                                onClick={() => setActiveModal('food')}
                                className="px-3 py-2 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center space-x-2"
                                title="Food & Macros Tracker"
                            >
                                <i className="fa-solid fa-utensils custom-accent-text"></i>
                                <span className="hidden sm:inline">Food Log</span>
                            </button>

                            {/* Settings */}
                            <button
                                onClick={() => setActiveModal('settings')}
                                className="p-2 w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center justify-center text-slate-600 dark:text-slate-300"
                                title="Grid & Appearance Settings"
                            >
                                <i className="fa-solid fa-sliders text-base"></i>
                            </button>

                            {/* Dark Mode Toggle */}
                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-2 w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center justify-center text-slate-600 dark:text-slate-300"
                                title="Toggle Dark/Light Mode"
                            >
                                <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-500'} text-base`}></i>
                            </button>

                            {/* JSON Data Backup */}
                            <button
                                onClick={() => setActiveModal('exportImport')}
                                className="p-2 w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center justify-center text-slate-600 dark:text-slate-300"
                                title="Export / Import Data"
                            >
                                <i className="fa-solid fa-file-export text-base"></i>
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* LEFT SIDEBAR - Saved Activities & Daily Stats */}
                        {}
                        <aside className="w-80 border-r border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col shrink-0 hidden lg:flex">
                            
                            {/* Daily Progress Widget */}
                            <div className="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Today's Progress</span>
                                    <span className="text-xs font-bold custom-accent-text">{stats.percent}% Completed</span>
                                </div>
                                <div className="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden mb-3">
                                    <div 
                                        className="h-full custom-accent-bg transition-all duration-500 rounded-full"
                                        style={{ width: `${stats.percent}%` }}
                                    ></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-center">
                                    <div className="bg-white dark:bg-slate-700/50 p-2 rounded-lg border border-slate-200/60 dark:border-slate-600/50">
                                        <div className="text-xs text-slate-400">Scheduled</div>
                                        <div className="text-base font-bold">{stats.totalHours} hrs</div>
                                    </div>
                                    <div className="bg-white dark:bg-slate-700/50 p-2 rounded-lg border border-slate-200/60 dark:border-slate-600/50">
                                        <div className="text-xs text-slate-400">Completed</div>
                                        <div className="text-base font-bold custom-accent-text">{stats.completedHours} hrs</div>
                                    </div>
                                </div>
                            </div>

                            {/* Saved Activity Library Header */}
                            <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                    <i className="fa-solid fa-shapes text-sm custom-accent-text"></i>
                                    <h2 className="font-semibold text-sm">Activity Library</h2>
                                </div>
                                <button
                                    onClick={() => setActiveModal('newActivity')}
                                    className="px-2.5 py-1 text-xs rounded-lg custom-accent-bg text-white hover:opacity-90 transition font-medium flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-plus text-[10px]"></i>
                                    <span>New</span>
                                </button>
                            </div>

                            {/* Draggable Saved Activities List */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
                                <p className="text-xs text-slate-400 mb-2">Drag activities directly onto the time grid or tap to add:</p>
                                {savedActivities.map(act => {
                                    const cat = categories.find(c => c.id === act.categoryId);
                                    const actColor = act.color || cat?.color || accentColor;
                                    return (
                                        <div
                                            key={act.id}
                                            draggable
                                            onDragStart={(e) => {
                                                e.dataTransfer.setData('application/json', JSON.stringify(act));
                                                setDraggedActivity(act);
                                            }}
                                            onDragEnd={() => setDraggedActivity(null)}
                                            className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-750 hover:shadow-md transition cursor-grab active:cursor-grabbing flex items-center justify-between group"
                                            style={{ borderLeftWidth: '4px', borderLeftColor: actColor }}
                                        >
                                            <div className="flex items-center space-x-3 overflow-hidden">
                                                <div 
                                                    className="w-8 h-8 rounded-lg flex items-center justify-center text-white shrink-0 shadow-xs"
                                                    style={{ backgroundColor: actColor }}
                                                >
                                                    <i className={`fa-solid ${act.icon || 'fa-tasks'} text-xs`}></i>
                                                </div>
                                                <div className="truncate">
                                                    <div className="font-medium text-sm truncate">{act.title}</div>
                                                    <div className="text-xs text-slate-400 flex items-center space-x-2">
                                                        <span>{cat?.name || 'General'}</span>
                                                        <span>•</span>
                                                        <span>{act.duration} min</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => handleAddBlockToTime(gridSettings.startHour * 60, act)}
                                                className="opacity-0 group-hover:opacity-100 p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:custom-accent-bg hover:text-white transition text-xs"
                                                title="Add to canvas starting hour"
                                            >
                                                <i className="fa-solid fa-plus"></i>
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Category Management Drawer Button */}
                            <div className="p-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                                <button
                                    onClick={() => setActiveModal('manageCategories')}
                                    className="w-full py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 transition flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-layer-group text-slate-400"></i>
                                    <span>Manage Categories & Colors</span>
                                </button>
                            </div>
                        </aside>

                        {/* MAIN TIME GRID CANVAS */}
                        {}

                                </div>

                                <div className="border-t border-slate-200 dark:border-slate-700 pt-3">
                                    <label className="block text-xs font-semibold mb-2">Import JSON State</label>
                                    <input
                                        type="file"
                                        accept=".json"
                                        onChange={(e) => {
                                            const file = e.target.files[0];
                                            if (!file) return;
                                            const reader = new FileReader();
                                            reader.onload = (event) => {
                                                try {
                                                    const imported = JSON.parse(event.target.result);
                                                    if (imported.accentColor) setAccentColor(imported.accentColor);
                                                    if (imported.gridSettings) setGridSettings(imported.gridSettings);
                                                    if (imported.categories) setCategories(imported.categories);
                                                    if (imported.savedActivities) setSavedActivities(imported.savedActivities);
                                                    if (imported.blocks) setBlocks(imported.blocks);
                                                    if (imported.foodData) setFoodData(imported.foodData);
                                                    setActiveModal(null);
                                                    showToast("Backup restored successfully!");
                                                } catch (err) {
                                                    showToast("Invalid JSON file!");
                                                }
                                            };
                                            reader.readAsText(file);
                                        }}
                                        className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 dark:file:bg-slate-700 file:text-slate-700 dark:file:text-slate-200 cursor-pointer"
                                    />
                                </div>
                            </div>
                        </Modal>
                    )}

                    {/* Toast Notification Banner */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl bg-slate-900 text-white text-xs font-medium shadow-lg flex items-center space-x-2 animate-bounce">
                            <i className="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        // GENERIC MODAL WRAPPER
        function Modal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs animate-fadeIn">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all">
                        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                            <h3 className="font-bold text-sm sm:text-base">{title}</h3>
                            <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                <i className="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>
                        <div className="p-5">{children}</div>
                    </div>
                </div>
            );
        }

        // POMODORO FOCUS STUDIO COMPONENT
        function PomodoroModal({ onClose, accentColor }) {
            const [workTime, setWorkTime] = useState(25);
            const [breakTime, setBreakTime] = useState(5);
            const [secondsLeft, setSecondsLeft] = useState(25 * 60);
            const [isRunning, setIsRunning] = useState(false);
            const [mode, setMode] = useState('work'); // 'work' | 'break'

            useEffect(() => {
                let interval = null;
                if (isRunning && secondsLeft > 0) {
                    interval = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
                } else if (secondsLeft === 0) {
                    playCompletionBeep();
                    if (mode === 'work') {
                        setMode('break');
                        setSecondsLeft(breakTime * 60);
                    } else {
                        setMode('work');
                        setSecondsLeft(workTime * 60);
                    }
                }
                return () => clearInterval(interval);
            }, [isRunning, secondsLeft, mode, workTime, breakTime]);

            const minutes = Math.floor(secondsLeft / 60);
            const secs = secondsLeft % 60;
            const totalDuration = (mode === 'work' ? workTime : breakTime) * 60;
            const progress = ((totalDuration - secondsLeft) / totalDuration) * 100;

            return (
                <Modal title="Pomodoro Focus Studio" onClose={onClose}>
                    <div className="text-center space-y-6">
                        {/* Mode Indicator Badge */}
                        <div className="inline-flex items-center px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-xs font-semibold space-x-2">
                            <span className={`w-2 h-2 rounded-full ${mode === 'work' ? 'bg-amber-500' : 'bg-emerald-500'}`}></span>
                            <span className="capitalize">{mode === 'work' ? 'Deep Focus Session' : 'Relaxation Break'}</span>
                        </div>

                        {/* Animated Timer Circle Display */}
                        <div className="relative w-48 h-48 mx-auto flex items-center justify-center">
                            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="42" stroke="currentColor" strokeWidth="6" className="text-slate-100 dark:text-slate-700" fill="none" />
                                <circle 
                                    cx="50" cy="50" r="42" 
                                    stroke={accentColor} 
                                    strokeWidth="6" 
                                    strokeDasharray="263.89"
                                    strokeDashoffset={263.89 - (263.89 * progress) / 100}
                                    strokeLinecap="round" 
                                    fill="none" 
                                    className="transition-all duration-500"
                                />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <span className="text-4xl font-extrabold tracking-tight font-mono">
                                    {minutes.toString().padStart(2, '0')}:{secs.toString().padStart(2, '0')}
                                </span>
                                <span className="text-[11px] text-slate-400 mt-1 uppercase tracking-widest">{isRunning ? 'Running' : 'Paused'}</span>
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="flex items-center justify-center space-x-3">
                            <button
                                onClick={() => setIsRunning(!isRunning)}
                                className="px-6 py-2.5 rounded-xl custom-accent-bg text-white text-xs font-bold shadow-md hover:opacity-90 transition flex items-center space-x-2"
                            >
                                <i className={`fa-solid ${isRunning ? 'fa-pause' : 'fa-play'}`}></i>
                                <span>{isRunning ? 'Pause' : 'Start Timer'}</span>
                            </button>
                            <button
                                onClick={() => {
                                    setIsRunning(false);
                                    setSecondsLeft((mode === 'work' ? workTime : breakTime) * 60);
                                }}
                                className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
                                title="Reset Timer"
                            >
                                <i className="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>

                        {/* Duration Setup */}
                        <div className="grid grid-cols-2 gap-3 pt-4 border-t border-slate-200 dark:border-slate-700 text-left">
                            <div>
                                <label className="block text-[11px] font-semibold text-slate-400 mb-1">Work Duration (m)</label>
                                <input
                                    type="number"
                                    min="1"
                                    max="90"
                                    value={workTime}
                                    onChange={(e) => {
                                        const val = parseInt(e.target.value) || 25;
                                        setWorkTime(val);
                                        if (mode === 'work' && !isRunning) setSecondsLeft(val * 60);
                                    }}
                                    className="w-full p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                                />
                            </div>
                            <div>
                                <label className="block text-[11px] font-semibold text-slate-400 mb-1">Break Duration (m)</label>
                                <input
                                    type="number"
                                    min="1"
                                    max="30"
                                    value={breakTime}
                                    onChange={(e) => {
                                        const val = parseInt(e.target.value) || 5;
                                        setBreakTime(val);
                                        if (mode === 'break' && !isRunning) setSecondsLeft(val * 60);
                                    }}
                                    className="w-full p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                                />
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        }

        // FOOD TRACKER DASHBOARD COMPONENT
        function FoodTrackerModal({ foodData, setFoodData, onClose, accentColor }) {
            const [mealInput, setMealInput] = useState({ name: '', kcal: '', protein: '', carbs: '', fat: '', type: 'Breakfast' });

            const totalKcal = foodData.meals.reduce((acc, m) => acc + (parseInt(m.kcal) || 0), 0);
            const totalProtein = foodData.meals.reduce((acc, m) => acc + (parseInt(m.protein) || 0), 0);
            const totalCarbs = foodData.meals.reduce((acc, m) => acc + (parseInt(m.carbs) || 0), 0);
            const totalFat = foodData.meals.reduce((acc, m) => acc + (parseInt(m.fat) || 0), 0);

            const handleAddMeal = (e) => {
                e.preventDefault();
                if (!mealInput.name || !mealInput.kcal) return;
                setFoodData(prev => ({
                    ...prev,
                    meals: [...prev.meals, { ...mealInput, id: Date.now() }]
                }));
                setMealInput({ name: '', kcal: '', protein: '', carbs: '', fat: '', type: 'Breakfast' });
            };

            return (
                <Modal title="Food & Macros Tracker" onClose={onClose}>
                    <div className="space-y-5 max-h-[75vh] overflow-y-auto pr-1">
                        
                        {/* Kcal Summary Card */}
                        <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-750 border border-slate-200 dark:border-slate-700">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Daily Calorie Target</span>
                                <span className="text-sm font-bold custom-accent-text">{totalKcal} / {foodData.goals.kcal} kcal</span>
                            </div>
                            <div className="w-full bg-slate-200 dark:bg-slate-700 h-3 rounded-full overflow-hidden mb-4">
                                <div 
                                    className="h-full custom-accent-bg transition-all rounded-full"
                                    style={{ width: `${Math.min(100, (totalKcal / foodData.goals.kcal) * 100)}%` }}
                                ></div>
                            </div>

                            {/* Macro Breakdown Mini Grid */}
                            <div className="grid grid-cols-3 gap-2 text-center text-xs">
                                <div className="bg-white dark:bg-slate-800 p-2 rounded-xl border border-slate-200/60 dark:border-slate-700">
                                    <div className="text-slate-400 text-[10px]">Protein</div>
                                    <div className="font-bold text-slate-800 dark:text-slate-200">{totalProtein}g / {foodData.goals.protein}g</div>
                                </div>
                                <div className="bg-white dark:bg-slate-800 p-2 rounded-xl border border-slate-200/60 dark:border-slate-700">
                                    <div className="text-slate-400 text-[10px]">Carbs</div>
                                    <div className="font-bold text-slate-800 dark:text-slate-200">{totalCarbs}g / {foodData.goals.carbs}g</div>
                                </div>
                                <div className="bg-white dark:bg-slate-800 p-2 rounded-xl border border-slate-200/60 dark:border-slate-700">
                                    <div className="text-slate-400 text-[10px]">Fat</div>
                                    <div className="font-bold text-slate-800 dark:text-slate-200">{totalFat}g / {foodData.goals.fat}g</div>
                                </div>
                            </div>
                        </div>

                        {/* Water Intake Quick Tracker */}
                        <div className="p-3.5 rounded-2xl bg-blue-50/50 dark:bg-slate-800 border border-blue-100 dark:border-slate-700 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <i className="fa-solid fa-glass-water text-blue-500 text-base"></i>
                                <div>
                                    <div className="text-xs font-semibold">Water Intake</div>
                                    <div className="text-[11px] text-slate-400">{foodData.waterGlasses} / {foodData.goals.water} Glasses</div>
                                </div>
                            </div>
                            <div className="flex items-center space-x-1">
                                <button
                                    onClick={() => setFoodData(prev => ({ ...prev, waterGlasses: Math.max(0, prev.waterGlasses - 1) }))}
                                    className="w-7 h-7 rounded-lg bg-white dark:bg-slate-700 border text-xs font-bold"
                                >
                                    -
                                </button>
                                <button
                                    onClick={() => setFoodData(prev => ({ ...prev, waterGlasses: prev.waterGlasses + 1 }))}
                                    className="w-7 h-7 rounded-lg bg-blue-500 text-white text-xs font-bold shadow-xs"
                                >
                                    +
                                </button>
                            </div>
                        </div>

                        {/* Add Meal Form */}
                        <form onSubmit={handleAddMeal} className="space-y-3 bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700">
                            <div className="text-xs font-bold text-slate-600 dark:text-slate-300">Log Food Item</div>
                            <div className="grid grid-cols-2 gap-2">
                                <input
                                    type="text"
                                    placeholder="Meal / Item Name..."
                                    value={mealInput.name}
                                    onChange={(e) => setMealInput(prev => ({ ...prev, name: e.target.value }))}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-750 text-xs"
                                />
                                <input
                                    type="number"
                                    placeholder="Calories (kcal)..."
                                    value={mealInput.kcal}
                                    onChange={(e) => setMealInput(prev => ({ ...prev, kcal: e.target.value }))}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-750 text-xs"
                                />
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <input
                                    type="number"
                                    placeholder="Protein (g)"
                                    value={mealInput.protein}
                                    onChange={(e) => setMealInput(prev => ({ ...prev, protein: e.target.value }))}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-750 text-xs"
                                />
                                <input
                                    type="number"
                                    placeholder="Carbs (g)"
                                    value={mealInput.carbs}
                                    onChange={(e) => setMealInput(prev => ({ ...prev, carbs: e.target.value }))}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-750 text-xs"
                                />
                                <input
                                    type="number"
                                    placeholder="Fat (g)"
                                    value={mealInput.fat}
                                    onChange={(e) => setMealInput(prev => ({ ...prev, fat: e.target.value }))}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-750 text-xs"
                                />
                            </div>
                            <button type="submit" className="w-full py-2 rounded-xl custom-accent-bg text-white text-xs font-semibold">
                                Add Meal Log
                            </button>
                        </form>

                        {/* Meal Log List */}
                        <div className="space-y-2">
                            <div className="text-xs font-semibold text-slate-500">Logged Meals</div>
                            {foodData.meals.length === 0 ? (
                                <p className="text-xs text-slate-400 italic">No meals logged for today yet.</p>
                            ) : (
                                foodData.meals.map(m => (
                                    <div key={m.id} className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs">
                                        <div>
                                            <div className="font-semibold">{m.name}</div>
                                            <div className="text-[10px] text-slate-400">P: {m.protein || 0}g • C: {m.carbs || 0}g • F: {m.fat || 0}g</div>
                                        </div>
                                        <div className="flex items-center space-x-3">
                                            <span className="font-bold custom-accent-text">{m.kcal} kcal</span>
                                            <button
                                                onClick={() => setFoodData(prev => ({ ...prev, meals: prev.meals.filter(item => item.id !== m.id) }))}
                                                className="text-slate-400 hover:text-rose-500"
                                            >
                                                <i className="fa-solid fa-trash-can"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </Modal>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
